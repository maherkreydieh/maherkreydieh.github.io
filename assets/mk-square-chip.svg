<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Maher Kreydieh - Mk square chip logo</title>
  <!-- pins -->
  <g stroke="#e0a060" stroke-width="2.4" stroke-linecap="round">
    <path d="M38 24 V14 M50 24 V14 M62 24 V14 M74 24 V14 M86 24 V14"/>
    <path d="M38 96 V106 M50 96 V106 M62 96 V106 M74 96 V106 M86 96 V106"/>
    <path d="M24 38 H14 M24 50 H14 M24 62 H14 M24 74 H14 M24 86 H14"/>
    <path d="M96 38 H106 M96 50 H106 M96 62 H106 M96 74 H106 M96 86 H106"/>
  </g>
  <!-- chip body -->
  <rect x="24" y="24" width="72" height="72" rx="6" fill="#0c100e" stroke="#e0a060" stroke-width="1.8"/>
  <!-- corner codes: ASCII 77 = M, 75 = K -->
  <text x="30" y="35" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" font-size="7" fill="#e0a060">77</text>
  <text x="90" y="35" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="5" fill="#6f7d76">75.0</text>
  <!-- Mk traces -->
  <g transform="translate(33 38) scale(0.54)">
    <g fill="none" stroke="#e0a060" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 80 V28 L32 46 L50 28 V80"/>
      <path d="M66 20 V80"/>
      <path d="M66 62 L82 46 V38"/>
      <path d="M66 62 L84 80"/>
    </g>
    <rect x="27.5" y="41.5" width="9" height="9" rx="1.5" fill="#e0a060"/>
    <g fill="#0c100e" stroke="#e0a060" stroke-width="3">
      <circle cx="14" cy="80" r="5"/><circle cx="50" cy="80" r="5"/><circle cx="66" cy="20" r="5"/>
      <circle cx="82" cy="38" r="5"/><circle cx="84" cy="80" r="5"/>
    </g>
  </g>
</svg>
